name: Tests

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'   # weekly, to notice changes in pycalphad's develop branch
  workflow_dispatch:

jobs:
  tests:
    name: ${{ matrix.os }}, Python ${{ matrix.python-version }}, pycalphad ${{ matrix.pycalphad }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.13']
        pycalphad: [release, develop]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pycalphad (latest release)
        if: matrix.pycalphad == 'release'
        run: python -m pip install pycalphad
      - name: Install pycalphad (develop branch)
        if: matrix.pycalphad == 'develop'
        run: python -m pip install "pycalphad @ git+https://github.com/pycalphad/pycalphad@develop"
      - name: Install pycalphad-cg
        # (not editable: pycalphad discovers installed pycalphad_* packages as plugins, which the tests cover)
        run: python -m pip install ".[test]"
      - name: Tests
        # (the pytest script, not "python -m pytest", so that the source directory is not importable)
        run: pytest tests -q

  pycalphad-suite:
    name: pycalphad's test suite with column generation, pycalphad ${{ matrix.pycalphad }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pycalphad: [release, develop]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install pycalphad (latest release)
        if: matrix.pycalphad == 'release'
        run: python -m pip install pycalphad
      - name: Install pycalphad (develop branch)
        if: matrix.pycalphad == 'develop'
        run: python -m pip install "pycalphad @ git+https://github.com/pycalphad/pycalphad@develop"
      - run: python -m pip install ".[test]"
      - name: pycalphad's own tests, plain
        run: cd "$RUNNER_TEMP" && pytest --pyargs pycalphad.tests -q -p no:cacheprovider
      - name: pycalphad's own tests, with column generation
        run: cd "$RUNNER_TEMP" && PYTHONPATH="$GITHUB_WORKSPACE/tests" pytest --pyargs pycalphad.tests -q -p no:cacheprovider -p upstream_suite_plugin
